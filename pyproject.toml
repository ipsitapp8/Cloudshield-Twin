[project]
name = "cloudshield-twin"
version = "0.1.0"
description = "CloudShield Twin: Observe -> Understand -> Simulate -> Remediate -> Prove"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2",
    "networkx>=3",
    "PyYAML>=6",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Only required when AWS_MODE=real (backend/aws_layer.py RealAws) or BEDROCK_ENABLED=true
# (backend/llm.py). Fake/replay mode never imports boto3.
aws = ["boto3>=1.34"]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "types-networkx",
    "types-PyYAML",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
